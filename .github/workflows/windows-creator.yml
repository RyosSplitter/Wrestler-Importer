name: Build standalone PSP Model Creator
on:
  push:
    branches: [feature/standalone-model-creator, feature/creator-waistline]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  creator:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - name: Original synthetic creator regression tests
        run: python -m unittest tests.test_model_creator tests.test_creator_library tests.test_creator_donor_import tests.test_creator_030 tests.test_creator_waist -v
      - name: Build separate portable application
        run: python -m tools.build_creator
      - name: Frozen creator live selection preview, assembly, native export and texture roundtrip
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\creator-smoke\report.json"
          New-Item -ItemType Directory -Path (Split-Path $output) | Out-Null
          $p = Start-Process dist/PSP-Model-Creator/PSP-Model-Creator.exe -ArgumentList @('--smoke-test',$output) -PassThru -Wait
          if (Test-Path $output) { Copy-Item $output dist/creator-smoke.json }
          if ($p.ExitCode -ne 0) { throw 'Frozen creator functional self-check failed' }
          $report = Get-Content $output -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.live_selection_preview_before_export -or -not $report.live_waistline_adjustment -or -not $report.configured_waistline_export_and_qa -or -not $report.waistline_project_roundtrip) { throw 'Creator self-check missing successful live waistline preview/export' }
          Copy-Item $output dist/creator-smoke.json
          Copy-Item "$env:RUNNER_TEMP/creator-smoke/*.png" dist/
      - name: Test drop-in executable over released 0.2 runtime and library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = "$env:RUNNER_TEMP/creator-base"
          New-Item -ItemType Directory -Path $base | Out-Null
          gh release download creator-preview-5-bf7111bd55032b469cb6dc861410de03b7bbb02b --pattern 'PSP-Model-Creator-0.2-Windows-x64.zip*' --dir $base
          $archive = "$base/PSP-Model-Creator-0.2-Windows-x64.zip"
          $expected = ((Get-Content "$archive.sha256") -split ' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Base release checksum mismatch' }
          Expand-Archive $archive "$base/extracted"
          $app = "$base/extracted/PSP-Model-Creator"
          $catalogBefore = (Get-FileHash "$app/creator_library/catalog.json").Hash
          Copy-Item dist/PSP-Model-Creator/PSP-Model-Creator.exe "$app/PSP-Model-Creator.exe" -Force
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP/creator-patch-smoke/report.json"
          New-Item -ItemType Directory -Path (Split-Path $output) | Out-Null
          $p = Start-Process "$app/PSP-Model-Creator.exe" -ArgumentList @('--smoke-test',$output) -PassThru -Wait
          if (Test-Path $output) { Copy-Item $output dist/creator-patch-smoke.json }
          if ($p.ExitCode -ne 0) { throw 'Overlay on original 0.2 runtime failed' }
          $report = Get-Content $output -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.add_donors_button -or -not $report.imported_donor_mixed_preview_and_export -or -not $report.oversized_pac_export_allowed -or -not $report.oversized_gui_warning_shown -or -not $report.maximum_texture_gui_rescue -or -not $report.frozen_hardy_bind_fit -or -not $report.live_waistline_adjustment -or -not $report.cutoff_stale_export_blocked -or -not $report.waistline_controls_visible) { throw 'Donor import/waistline overlay checks failed' }
          if ((Get-FileHash "$app/creator_library/catalog.json").Hash -ne $catalogBefore) { throw 'Bundled catalog changed during patch self-check' }
      - name: Package drop-in donor patch
        run: python -m tools.build_creator_patch
      - name: Package standalone application
        shell: python
        run: |
          import hashlib,shutil
          from pathlib import Path
          path=Path(shutil.make_archive('dist/PSP-Model-Creator-0.3.1-Windows-x64','zip','dist','PSP-Model-Creator'))
          Path(str(path)+'.sha256').write_text(hashlib.file_digest(path.open('rb'),'sha256').hexdigest()+'  '+path.name+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSP-Model-Creator-0.3.1-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/creator-*.png
            dist/creator-smoke.json
            dist/creator-patch-smoke.json
      - name: Publish isolated experimental creator
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          PSP Model Creator 0.3.1 moves the default torso/legs cutoff to the waistband and adds a live Higher/Lower slider, a rest-pose cut-line guide and Reset. Preview, native assembly, contour stitching, skeleton selection and seam/pose QA share the configured plane. Saved recipes retain the chosen height; older recipes preserve their legacy cut until Reset is selected. A changed cutoff blocks stale exports until reassembly. Whole-donor PACs remain byte-exact and original donor files are preserved. Retains Add donors, native part binds and optional texture-only fitting. Frozen full-app and original-runtime patch checks exercise the waistline preview, custom export/QA, save/reload/reset, stale-export protection and existing creator workflows. Close the app and extract the 0.3.1 Creator Patch into its folder, keeping _internal and creator_library. The complete Windows ZIP includes all 31 prepared donors. New mixed models still need visual and PPSSPP review; no converter changes.
          '@ | Set-Content "$env:RUNNER_TEMP/creator-notes.txt" -Encoding utf8NoBOM
          $tag = "creator-preview-${{ github.run_number }}-${{ github.sha }}"
          gh release create $tag dist/*.zip dist/*.sha256 dist/creator-window.png dist/creator-library-window.png dist/creator-030-window.png dist/creator-waistline-window.png --target '${{ github.sha }}' --prerelease --title 'PSP Model Creator 0.3.1 — waistband torso cutoff' --notes-file "$env:RUNNER_TEMP/creator-notes.txt"

name: Build standalone PSP Model Creator
on:
  push:
    branches: [feature/standalone-model-creator, feature/creator-waistline, feature/model-morph-studio, feature/creator-uv-editor, build/creator-blender-package]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  creator:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - name: Build separate portable application
        run: python -m tools.build_creator
      - name: Prepare the existing Suite Blender runtime for morph verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = "$env:RUNNER_TEMP/creator-suite-runtime"
          New-Item -ItemType Directory -Path $folder | Out-Null
          gh release download suite-painted-23-1d1059e7ee4761dee320fb2e32a6dfe14ec5016d --pattern 'PSP-Model-Suite-v0.29.2-Windows-x64.zip' --dir $folder
          $archive = "$folder/PSP-Model-Suite-v0.29.2-Windows-x64.zip"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '7c5683b59e2a5a719ef33f6321ede5fe4d6c468c9aa2769b2524d83f12d7f0ae') { throw 'Suite runtime archive hash mismatch' }
          python -c "import zipfile,pathlib,os; folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'creator-suite-runtime'; archive=zipfile.ZipFile(folder/'PSP-Model-Suite-v0.29.2-Windows-x64.zip'); prefix='PSP-Model-Suite/runtime/blender/'; [(folder.joinpath(n[len(prefix):]).parent.mkdir(parents=True,exist_ok=True),folder.joinpath(n[len(prefix):]).write_bytes(archive.read(n))) for n in archive.namelist() if n.startswith(prefix) and not n.endswith('/') and '..' not in pathlib.PurePosixPath(n).parts]"
      - name: Creator regressions and real Blender editing checks
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/creator-suite-runtime;$env:PATH"
          $env:PS2PSP_DEV_BLENDER = "$env:RUNNER_TEMP/creator-suite-runtime/blender.exe"
          python -m unittest tests.test_model_creator tests.test_creator_library tests.test_creator_donor_import tests.test_creator_030 tests.test_creator_waist tests.test_morph_studio tests.test_uv_editor tests.test_blender_edit -v
      - name: Package Creator and Blender worker patch
        run: python -m tools.build_creator_patch
      - name: Frozen creator live selection preview, assembly, native export and texture roundtrip
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\creator-smoke\report.json"
          New-Item -ItemType Directory -Path (Split-Path $output) | Out-Null
          $p = Start-Process dist/PSP-Model-Creator/PSP-Model-Creator.exe -ArgumentList @('--smoke-test',$output,'--morph-runtime',"$env:RUNNER_TEMP/creator-suite-runtime/blender.exe") -PassThru -Wait
          if (Test-Path $output) { Copy-Item $output dist/creator-smoke.json }
          if ($p.ExitCode -ne 0) { throw 'Frozen creator functional self-check failed' }
          $report = Get-Content $output -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.live_selection_preview_before_export -or -not $report.live_waistline_adjustment -or -not $report.configured_waistline_export_and_qa -or -not $report.waistline_project_roundtrip -or -not $report.morph_studio -or -not $report.morph_native_attributes_preserved -or -not $report.morph_reset_export_byte_exact -or -not $report.uv_live_preview -or -not $report.uv_canvas_mouse_drag -or -not $report.uv_morph_combined_export -or -not $report.uv_reset_export_byte_exact -or -not $report.blender_editor -or -not $report.blender_worker_roundtrip_exact -or -not $report.blender_import_validated -or -not $report.blender_texture_paint -or -not $report.blender_undo_preserves_builds -or -not $report.blender_skin_weights_rejected) { throw 'Creator self-check missing successful live waistline preview/export' }
          Copy-Item $output dist/creator-smoke.json
          Copy-Item "$env:RUNNER_TEMP/creator-smoke/*.png" dist/
      - name: Test drop-in executable over released 0.2 runtime and library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = "$env:RUNNER_TEMP/creator-base"
          New-Item -ItemType Directory -Path $base | Out-Null
          gh release download creator-preview-5-bf7111bd55032b469cb6dc861410de03b7bbb02b --pattern 'PSP-Model-Creator-0.2-Windows-x64.zip*' --dir $base
          $archive = "$base/PSP-Model-Creator-0.2-Windows-x64.zip"
          $expected = ((Get-Content "$archive.sha256") -split ' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Base release checksum mismatch' }
          Expand-Archive $archive "$base/extracted"
          $app = "$base/extracted/PSP-Model-Creator"
          $catalogBefore = (Get-FileHash "$app/creator_library/catalog.json").Hash
          Expand-Archive dist/PSP-Model-Creator-0.6.0-Creator-Patch.zip $app -Force
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP/creator-patch-smoke/report.json"
          New-Item -ItemType Directory -Path (Split-Path $output) | Out-Null
          $p = Start-Process "$app/PSP-Model-Creator.exe" -ArgumentList @('--smoke-test',$output,'--morph-runtime',"$env:RUNNER_TEMP/creator-suite-runtime/blender.exe") -PassThru -Wait
          if (Test-Path $output) { Copy-Item $output dist/creator-patch-smoke.json }
          if ($p.ExitCode -ne 0) { throw 'Overlay on original 0.2 runtime failed' }
          $report = Get-Content $output -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.add_donors_button -or -not $report.imported_donor_mixed_preview_and_export -or -not $report.oversized_pac_export_allowed -or -not $report.oversized_gui_warning_shown -or -not $report.maximum_texture_gui_rescue -or -not $report.frozen_hardy_bind_fit -or -not $report.live_waistline_adjustment -or -not $report.cutoff_stale_export_blocked -or -not $report.waistline_controls_visible -or -not $report.morph_live_preview -or -not $report.morph_stale_export_blocked -or -not $report.morph_project_roundtrip -or -not $report.uv_project_roundtrip -or -not $report.uv_stale_export_blocked -or -not $report.uv_palette_texture_import -or -not $report.blender_editor -or -not $report.blender_worker_roundtrip_exact -or -not $report.blender_import_validated -or -not $report.blender_skin_weights_rejected) { throw 'Donor import/waistline overlay checks failed' }
          if ((Get-FileHash "$app/creator_library/catalog.json").Hash -ne $catalogBefore) { throw 'Bundled catalog changed during patch self-check' }
      - name: Package standalone application
        shell: python
        run: |
          import hashlib,json,shutil
          from pathlib import Path
          app=Path('dist/PSP-Model-Creator')
          for cache in app.rglob('__pycache__'):shutil.rmtree(cache)
          manifest=json.loads((app/'MANIFEST.json').read_text())
          manifest['files']={p.relative_to(app).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in app.rglob('*') if p.is_file() and p.name!='MANIFEST.json'}
          (app/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          path=Path(shutil.make_archive('dist/PSP-Model-Creator-0.6.0-Windows-x64','zip','dist','PSP-Model-Creator'))
          Path(str(path)+'.sha256').write_text(hashlib.file_digest(path.open('rb'),'sha256').hexdigest()+'  '+path.name+'\n')
      - uses: actions/upload-artifact@v4
        id: creator_artifacts
        if: always()
        with:
          name: PSP-Model-Creator-0.6.0-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/creator-*.png
            dist/creator-smoke.json
            dist/creator-patch-smoke.json
      - name: Publish isolated experimental creator
        if: github.ref_name != 'build/creator-blender-package'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          PSP Model Creator 0.6.0 adds an integrated Edit in Blender workflow using the existing Blender 4.3.2 runtime. Open an assembled model with native record IDs, UVs, textures and bind-position rig; import supported shape, UV and texture edits as a separately validated build; Undo restores the preceding build. Topology, rig, weights, material assignments and shader graph changes are rejected. PAC structure, contact/pose and size checks remain mandatory. Includes the existing Morph Studio, UV Editor, prepared library and native export workflow. Close Creator and merge all patch files, including _internal, into the existing Creator folder. Blender is not bundled; choose the installed Suite runtime. Full-package and original 0.2-runtime overlay smoke checks exercise real Blender no-op/edit/paint imports, weight rejection and Undo. Analytical checks are not game validation.
          '@ | Set-Content "$env:RUNNER_TEMP/creator-notes.txt" -Encoding utf8NoBOM
          $tag = "creator-preview-${{ github.run_number }}-${{ github.sha }}"
          gh release create $tag dist/*.zip dist/*.sha256 dist/creator-window.png dist/creator-library-window.png dist/creator-030-window.png dist/creator-waistline-window.png dist/creator-morph-window.png dist/creator-uv-window.png dist/creator-blender-window.png dist/creator-smoke.json dist/creator-patch-smoke.json --target '${{ github.sha }}' --prerelease --title 'PSP Model Creator 0.6.0 — Blender Editing, UV Editor and Morph Studio' --notes-file "$env:RUNNER_TEMP/creator-notes.txt"
      - name: Record artifact-only build receipt
        if: always() && github.ref_name == 'build/creator-blender-package'
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.creator_artifacts.outputs.artifact-url }}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          receipt=dict(commit=os.environ['BUILD_SHA'],run_id=os.environ['BUILD_RUN'],status=os.environ['BUILD_STATUS'],artifact_url=os.environ.get('ARTIFACT_URL',''),version='0.6.0',files={})
          for p in (root/'dist').glob('*.zip'):
              receipt['files'][p.name]=dict(bytes=p.stat().st_size,sha256=hashlib.file_digest(p.open('rb'),'sha256').hexdigest())
          for name in ('creator-smoke.json','creator-patch-smoke.json'):
              p=root/'dist'/name
              if p.exists():receipt[name]=json.loads(p.read_text(encoding='utf-8'))
          branch='build/creator-blender-receipt'
          exists=subprocess.run(['git','ls-remote','--exit-code','--heads','origin',branch],capture_output=True).returncode==0
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'creator-build-receipt'
          if exists:
              subprocess.run(['git','fetch','origin',branch],check=True)
              subprocess.run(['git','worktree','add','-B',branch,str(path),'FETCH_HEAD'],check=True)
          else:
              subprocess.run(['git','worktree','add','--detach',str(path),'HEAD'],check=True)
              subprocess.run(['git','-C',str(path),'switch','--orphan',branch],check=True)
          subprocess.run(['git','-C',str(path),'config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','-C',str(path),'config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          out=path/(os.environ['BUILD_SHA']+'.json');out.write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          subprocess.run(['git','-C',str(path),'add',out.name],check=True)
          if subprocess.run(['git','-C',str(path),'diff','--cached','--quiet']).returncode:
              subprocess.run(['git','-C',str(path),'commit','-m','Record Creator 0.6.0 Windows package validation'],check=True)
          subprocess.run(['git','-C',str(path),'push','origin',branch],check=True)

name: Build PSP Model Suite preview
on:
  push:
    branches: [feature/wwe13-wii-app-preview, feature/offline-retexture-editor, feature/conversion-countdown, feature/wwe13-road-dogg, feature/wii-clothing-seams, feature/batch-converter, feature/export-seam-checks, feature/painted-clothing-edges]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - name: Prepare existing development-only donor fixture
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          Path('assets').mkdir(exist_ok=True)
          with zipfile.ZipFile('downloads/Wrestler-Importer-beta-0.1.1.zip') as archive:
              for name in ('Kurt-Angle-Ring.PAC','Full Body.yobj'):
                  Path('assets',name).write_bytes(archive.read('WrestlerImporterBeta/assets/'+name))
      - run: python -m tools.ci_tests
      - name: Build frozen suite and audited existing runtime
        run: python -m tools.build_portable --suite
      - name: Existing frozen converter controls and bundled Blender
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\suite-converter-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\converter-smoke.json"
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Existing converter GUI/runtime smoke failed' }
          Copy-Item $output dist/converter-smoke.json
          Copy-Item ([System.IO.Path]::ChangeExtension($output,'png')) dist/converter-smoke.png
      - name: Frozen HCTP conversion and final source-linked seam QA
        timeout-minutes: 15
        shell: python
        run: |
          import os,sys,json,zipfile,subprocess,hashlib
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.portable_fixture import create
          folder=Path(os.environ['RUNNER_TEMP'])/'hctp-seams-smoke';folder.mkdir()
          with zipfile.ZipFile('downloads/Jericho-QA-facial-weights-experiment.zip') as archive:
              source_model=json.loads(archive.read('trial/input-source-weighted.json'))
          source=folder/'modified-source.pac';create(source_model,source)
          base=Path('assets/Kurt-Angle-Ring.PAC').resolve()
          inputs={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (source,base)}
          (folder/'request.json').write_text(json.dumps(dict(source=str(source),base=str(base),source_format='hctp')),encoding='utf-8')
          env=dict(os.environ);env['PATH']=os.environ['SystemRoot']+'\\System32;'+os.environ['SystemRoot']
          child=subprocess.run(['dist/PSP-Model-Suite/PSP-Model-Suite.exe','--worker',str(folder/'request.json')],env=env,timeout=800)
          if child.returncode:
              print((folder/'error.log').read_text(encoding='utf-8'))
              raise RuntimeError('Frozen HCTP conversion failed')
          result=json.loads((folder/'success.json').read_text(encoding='utf-8'))
          seams=json.loads(Path(result['export_seams']['report']).read_text(encoding='utf-8'))
          assert seams['poses_checked']>=15 and seams['matched_contact_locations']>0
          assert 'seam-wrist-flex' in seams['poses'] and 'seam-knee-flex' in seams['poses']
          guards=json.loads(Path(result['painted_clothing_edges']['report']).read_text(encoding='utf-8'))
          reduced=json.loads((Path(result['pac']).parent/'reduced.json').read_text(encoding='utf-8'))
          assert guards==reduced['reduction_report']['painted_clothing_edge_guards']
          assert guards['samples_per_face']==91
          assert result['review_flags']>=seams['review_findings']
          assert 'Export seam checks' in Path(result['report']).read_text(encoding='utf-8')
          assert result['sha256']==hashlib.sha256(Path(result['pac']).read_bytes()).hexdigest()
          assert inputs=={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in inputs}
          Path('dist/hctp-seams-smoke.json').write_text(json.dumps(dict(status='pass',final_export_seams=True,
              painted_clothing_guard_verified=True,poses_checked=seams['poses_checked'],matched_contacts=seams['matched_contact_locations'],
              findings=seams['review_findings'],input_hashes_unchanged=True,final_pac_sha256=result['sha256']),indent=2),encoding='utf-8')
      - name: Frozen suite folder browsing, editable export, PNG import, PAC round trips and validator
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\model-suite-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\suite-smoke\report.json"
          New-Item -ItemType Directory -Path (Split-Path $output) | Out-Null
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--suite-smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Frozen suite functional smoke failed' }
          Copy-Item $output dist/suite-smoke.json
          Copy-Item "$env:RUNNER_TEMP/suite-smoke/*.png" dist/
      - name: Frozen offline Retexture node, live edits, projects and PAC export
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\retexture-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\retexture-smoke\report.json"
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--retexture-smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/retexture-smoke/report.error.log" -ErrorAction SilentlyContinue
            throw 'Frozen Retexture functional smoke failed'
          }
          Copy-Item $output dist/retexture-smoke.json
          Copy-Item ([System.IO.Path]::ChangeExtension($output,'png')) dist/retexture-smoke.png
      - name: Frozen JBI archive selection, all texture modes, accessories, Save As and cancellation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\jbi-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\jbi-smoke\report.json"
          $base = (Resolve-Path assets/Kurt-Angle-Ring.PAC).Path
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--jbi-smoke-test',$output,$base) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/jbi-smoke/report.error.log" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP/jbi-app-smoke/jobs/*/error.log" | ForEach-Object { Get-Content $_ }
            throw 'Frozen JBI functional smoke failed'
          }
          Copy-Item $output dist/jbi-smoke.json
          Copy-Item "$env:RUNNER_TEMP/jbi-smoke/*.png" dist/
      - name: Frozen Wii selection, clothing seams, conversion countdown, Blender, QA, preview, entrance Save As and cancellation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\wii-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\wii-smoke\report.json"
          $base = (Resolve-Path assets/Kurt-Angle-Ring.PAC).Path
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--wii-smoke-test',$output,$base) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/wii-smoke/report.error.log" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP/wii-app-smoke/jobs/*/error.log" | ForEach-Object { Get-Content $_ }
            throw 'Frozen Wii functional smoke failed'
          }
          Copy-Item $output dist/wii-smoke.json
          Copy-Item "$env:RUNNER_TEMP/wii-smoke/*.png" dist/
      - name: Frozen batch queue, recovery, archive costumes, previews, exports and cancellation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\batch-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\batch-smoke\report.json"
          $base = (Resolve-Path assets/Kurt-Angle-Ring.PAC).Path
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--batch-smoke-test',$output,$base) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/batch-smoke/report.error.log" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP/batch-app-smoke/batches/*/models/*/error.log" | ForEach-Object { Get-Content $_ }
            throw 'Frozen batch functional smoke failed'
          }
          Copy-Item $output dist/batch-smoke.json
          Copy-Item ([System.IO.Path]::ChangeExtension($output,'png')) dist/batch-smoke.png
      - name: Package suite portable ZIP
        shell: python
        run: |
          import hashlib,shutil
          from pathlib import Path
          path=Path(shutil.make_archive('dist/PSP-Model-Suite-v0.29.2-Windows-x64','zip','dist','PSP-Model-Suite'))
          Path(str(path)+'.sha256').write_text(hashlib.file_digest(path.open('rb'),'sha256').hexdigest()+'  '+path.name+'\n')
      - name: Build optional verified overlay update from the published v0.29.1 app
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json,subprocess,traceback,sys
          from pathlib import Path
          # GitHub's `shell: python` executes a script in RUNNER_TEMP, not
          # `python -m` from the checkout. Make this import path explicit.
          sys.path.insert(0,str(Path.cwd()))
          folder=Path('build/previous-release');folder.mkdir(parents=True,exist_ok=True)
          previous=folder/'PSP-Model-Suite-v0.29.1-Windows-x64.zip'
          output=Path('dist/PSP-Model-Suite-v0.29.1-to-v0.29.2-Update.zip')
          try:
              from tools.build_suite_update import build
              subprocess.run(['gh','release','download','suite-seams-22-624a8906be493b552027ba2e2374d22bf0118d46','--repo','RyosSplitter/Wrestler-Importer','--pattern',previous.name,'--dir',str(folder)],check=True)
              report=build(previous,'dist/PSP-Model-Suite',output,'7003fa6fd9254b437921eedb282d6a2609a6dde859c67199798151e1dca32e14',from_version='0.29.1',to_version='0.29.2')
              print('Verified overlay bytes:',report['zip_bytes'],'changed files:',len(report['changed_files']))
              report['status']='pass'
          except Exception as exc:
              output.unlink(missing_ok=True);Path(str(output)+'.sha256').unlink(missing_ok=True)
              report=dict(status='withheld',reason=str(exc),full_app='All frozen app checks passed; use the complete portable ZIP instead.')
              detail=traceback.format_exc().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=Optional small update withheld::'+detail)
          Path('dist/update-smoke.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: PSP-Model-Suite-v0.29.2-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.png
            dist/*smoke.json
      - name: Publish painted clothing border fix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          PSP Model Suite v0.29.2 fixes HCTP painted clothing borders that could skew during simplification even when material boundaries were protected. Source-image contrast at adjacent limb faces retains the original support around dark wristbands and knee pads sharing a map with skin. The A-Train study restores the source knee-pad/wristband outlines with 40 additional reduced triangles. Selection is based on images/geometry/weights, with no wrestler-name or hash special case. Source pixels, UVs and prepared weights are not edited. Existing budgets and validation gates remain mandatory. QA links the new selection evidence alongside final source-relative seam checks. Retains HCTP/JBI/Wii conversion, batch previews and checked saves, offline Retexture and countdowns. Full frozen Windows conversion/editor/JBI/Wii/batch checks; HCTP checks guard propagation. Includes a verified v0.29.1-to-v0.29.2 overlay only if all manifest checks pass, plus the full portable Windows app/runtime/sources/licenses. No game assets are bundled. Dark/light sampling does not detect every clothing color; visual and PPSSPP review remain necessary.
          '@ | Set-Content "$env:RUNNER_TEMP/suite-release-notes.txt" -Encoding utf8NoBOM
          $tag = "suite-painted-${{ github.run_number }}-${{ github.sha }}"
          gh release create $tag dist/*.zip dist/*.sha256 dist/*.png dist/*smoke.json --target '${{ github.sha }}' --prerelease --title 'PSP Model Suite v0.29.2 — Painted wristband and knee-pad borders' --notes-file "$env:RUNNER_TEMP/suite-release-notes.txt"

name: Build PSP Model Suite preview
on:
  push:
    branches: [feature/wwe13-wii-app-preview, feature/offline-retexture-editor]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - name: Prepare existing development-only donor fixture
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          Path('assets').mkdir(exist_ok=True)
          with zipfile.ZipFile('downloads/Wrestler-Importer-beta-0.1.1.zip') as archive:
              for name in ('Kurt-Angle-Ring.PAC','Full Body.yobj'):
                  Path('assets',name).write_bytes(archive.read('WrestlerImporterBeta/assets/'+name))
      - run: python -m tools.ci_tests
      - name: Build frozen suite and audited existing runtime
        run: python -m tools.build_portable --suite
      - name: Existing frozen converter controls and bundled Blender
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\suite-converter-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\converter-smoke.json"
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Existing converter GUI/runtime smoke failed' }
          Copy-Item $output dist/converter-smoke.json
          Copy-Item ([System.IO.Path]::ChangeExtension($output,'png')) dist/converter-smoke.png
      - name: Frozen suite folder browsing, editable export, PNG import, PAC round trips and validator
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\model-suite-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\suite-smoke\report.json"
          New-Item -ItemType Directory -Path (Split-Path $output) | Out-Null
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--suite-smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Frozen suite functional smoke failed' }
          Copy-Item $output dist/suite-smoke.json
          Copy-Item "$env:RUNNER_TEMP/suite-smoke/*.png" dist/
      - name: Frozen offline Retexture node, live edits, projects and PAC export
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\retexture-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\retexture-smoke\report.json"
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--retexture-smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/retexture-smoke/report.error.log" -ErrorAction SilentlyContinue
            throw 'Frozen Retexture functional smoke failed'
          }
          Copy-Item $output dist/retexture-smoke.json
          Copy-Item ([System.IO.Path]::ChangeExtension($output,'png')) dist/retexture-smoke.png
      - name: Frozen JBI archive selection, all texture modes, accessories, Save As and cancellation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\jbi-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\jbi-smoke\report.json"
          $base = (Resolve-Path assets/Kurt-Angle-Ring.PAC).Path
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--jbi-smoke-test',$output,$base) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/jbi-smoke/report.error.log" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP/jbi-app-smoke/jobs/*/error.log" | ForEach-Object { Get-Content $_ }
            throw 'Frozen JBI functional smoke failed'
          }
          Copy-Item $output dist/jbi-smoke.json
          Copy-Item "$env:RUNNER_TEMP/jbi-smoke/*.png" dist/
      - name: Frozen Wii selection, decoding, Blender, QA, preview, entrance Save As and cancellation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\wii-app-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\wii-smoke\report.json"
          $base = (Resolve-Path assets/Kurt-Angle-Ring.PAC).Path
          $p = Start-Process dist/PSP-Model-Suite/PSP-Model-Suite.exe -ArgumentList @('--wii-smoke-test',$output,$base) -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP/wii-smoke/report.error.log" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP/wii-app-smoke/jobs/*/error.log" | ForEach-Object { Get-Content $_ }
            throw 'Frozen Wii functional smoke failed'
          }
          Copy-Item $output dist/wii-smoke.json
          Copy-Item "$env:RUNNER_TEMP/wii-smoke/*.png" dist/
      - name: Package suite portable ZIP
        shell: python
        run: |
          import hashlib,shutil
          from pathlib import Path
          path=Path(shutil.make_archive('dist/PSP-Model-Suite-v0.28.0-Windows-x64','zip','dist','PSP-Model-Suite'))
          Path(str(path)+'.sha256').write_text(hashlib.file_digest(path.open('rb'),'sha256').hexdigest()+'  '+path.name+'\n')
      - name: Build optional verified overlay update from the published v0.27.1 app
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json,subprocess,traceback,sys
          from pathlib import Path
          # GitHub's `shell: python` executes a script in RUNNER_TEMP, not
          # `python -m` from the checkout. Make this import path explicit.
          sys.path.insert(0,str(Path.cwd()))
          folder=Path('build/previous-release');folder.mkdir(parents=True,exist_ok=True)
          previous=folder/'PSP-Model-Suite-v0.27.1-Windows-x64.zip'
          output=Path('dist/PSP-Model-Suite-v0.27.1-to-v0.28.0-Update.zip')
          try:
              from tools.build_suite_update import build
              subprocess.run(['gh','release','download','suite-wii-11-97c2a47e33f0f28687ce2c233aa02327cf29a402','--repo','RyosSplitter/Wrestler-Importer','--pattern',previous.name,'--dir',str(folder)],check=True)
              report=build(previous,'dist/PSP-Model-Suite',output,'e84597bf550e4b478ca4b38a03476634478e05d2282561d7b70baf09f23103c1')
              print('Verified overlay bytes:',report['zip_bytes'],'changed files:',len(report['changed_files']))
              report['status']='pass'
          except Exception as exc:
              output.unlink(missing_ok=True);Path(str(output)+'.sha256').unlink(missing_ok=True)
              report=dict(status='withheld',reason=str(exc),full_app='All frozen app checks passed; use the complete portable ZIP instead.')
              detail=traceback.format_exc().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=Optional small update withheld::'+detail)
          Path('dist/update-smoke.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: PSP-Model-Suite-v0.28.0-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.png
            dist/*smoke.json
      - name: Publish isolated Wii suite preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          PSP Model Suite v0.28.0 adds an offline Retexture node inside Model Editor, with a dedicated workspace: texture thumbnails, protected-area masks, selection/recolor, brush/eraser, imported artwork layers, opacity/order/move/rotate/mirror/perspective corners, UV guides, reference pictures, orbit/zoom and live encoded model preview during active strokes. Portable .pspret projects retain the original PAC, layers, masks and references. Export checks actual encoded size, keeps all model/rigging/UV/material bytes and alpha unchanged, pins untouched texture colors, and writes a new PAC plus report. No online service, model download, API key or additional dependency. Supports observed native PSP PAC/indexed-GIM layouts; convert other platforms first. Existing HCTP/JBI/Wii converter behavior and accepted PACs remain intact; main remains unmerged. Includes the v0.27.1 Q7/Q8 source decoder fix. Full bundled Blender/runtime/source/licenses; Windows 10/11 x64, Windows 7-style UI, no game assets bundled. A verified v0.27.1-to-v0.28.0 overlay is included only if every manifest check passes. Frozen Windows tests exercise continuous-stroke live preview, actual editor-tree entry, layers, project reopen and PAC export alongside all converter/suite/JBI/Wii regressions. CPU preview speed depends on the model/computer and is not PSP shader emulation. Test appearance in PPSSPP. See sources/converter/docs/offline-retexture-editor.md.
          '@ | Set-Content "$env:RUNNER_TEMP/suite-release-notes.txt" -Encoding utf8NoBOM
          $tag = "suite-retexture-${{ github.run_number }}-${{ github.sha }}"
          gh release create $tag dist/*.zip dist/*.sha256 dist/*.png dist/*smoke.json --target '${{ github.sha }}' --prerelease --title 'PSP Model Suite v0.28.0 — Offline Retexture editor' --notes-file "$env:RUNNER_TEMP/suite-release-notes.txt"

name: Build portable PS2PSP preview
on:
  workflow_dispatch:
  push:
    branches: [feature/portable-ps2psp, fix/hctp-primary-model, experiment/precision-budget-fit, experiment/multi-yobj-accessories]
    paths: ['desktop/**', 'ps2psp_converter.py', 'app/ps2_textures.py', 'tools/build_portable.py', 'tools/portable_fixture.py', 'tools/blender_reduce.py', 'tools/pac_inspect.py', 'tools/hctp_read.py', 'tools/hctp_weights.py', 'tools/yobj_read.py', 'requirements-desktop.txt', 'docs/portable-*.md', 'tests/test_portable_*.py', 'tests/test_main_model_selection.py', '.github/workflows/windows-portable.yml']
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - name: Prepare development-only PSP donor and modified HCTP trials
        shell: python
        run: |
          from pathlib import Path
          import json,zipfile,sys
          sys.path.insert(0,str(Path.cwd()))
          from tools.portable_fixture import create, create_with_accessories
          from tools.generate_conformance_fixtures import pac, vectors
          from tools.pac_inspect import inspect_pac
          Path('assets').mkdir(exist_ok=True)
          Path('build/test-inputs').mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('downloads/Wrestler-Importer-beta-0.1.1.zip') as z:
              for name in ('Kurt-Angle-Ring.PAC','Full Body.yobj'):
                  Path('assets',name).write_bytes(z.read('WrestlerImporterBeta/assets/'+name))
          cases=[('Lance','1800-hybrid-weight-review.zip','1800-hybrid-weight-review/source-weighted.json'),('Jericho','Jericho-QA-facial-weights-experiment.zip','trial/input-source-weighted.json')]
          for label,archive,entry in cases:
              with zipfile.ZipFile('downloads/'+archive) as z: source=json.loads(z.read(entry))
              create(source,Path('build/test-inputs',label+'-modified-HCTP.pac'))
              if label=='Lance':create_with_accessories(source,Path('build/test-inputs/LanceMulti-modified-HCTP.pac'))
      - run: python -m tools.ci_tests
      - name: Build app, audited runtime, source bundle and notices
        run: python -m tools.build_portable
      - name: Packaged UI and bundled runtime with developer tools removed from PATH
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\ps2psp-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\portable-smoke.json"
          $p = Start-Process dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe -ArgumentList @('--smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Frozen GUI/runtime smoke test failed' }
          Get-Content $output
      - name: Frozen conversion, QA and textured previews including multi-YOBJ source
        timeout-minutes: 25
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in @('Lance','Jericho','LanceMulti')) {
            $job = "$env:RUNNER_TEMP\portable-$name"
            New-Item -ItemType Directory -Path $job | Out-Null
            @{source=(Resolve-Path "build/test-inputs/$name-modified-HCTP.pac").Path; base=(Resolve-Path 'assets/Kurt-Angle-Ring.PAC').Path; source_format='hctp'} | ConvertTo-Json | Set-Content "$job/request.json" -Encoding utf8NoBOM
            $p = Start-Process dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe -ArgumentList @('--worker',"$job/request.json") -PassThru -Wait
            if ($p.ExitCode -ne 0) { Get-Content "$job/error.log"; Get-Content "$job/work/geometry-0.log"; throw "Frozen $name conversion failed" }
            Get-Content "$job/success.json"
          }
          $single = Get-Content "$env:RUNNER_TEMP\portable-Lance\success.json" -Raw | ConvertFrom-Json
          $multi = Get-Content "$env:RUNNER_TEMP\portable-LanceMulti\success.json" -Raw | ConvertFrom-Json
          if ($multi.model_count -ne 3 -or $multi.accessory_sections.Count -ne 2) { throw 'Accessory source models were dropped' }
          if ($single.sha256 -eq $multi.sha256) { throw 'Multi-model output unexpectedly equals main-only output' }
          Write-Output 'Multi-model input retains two independently audited PSP accessories.'
      - name: Main geometry remains identical with independent accessory models
        shell: python
        run: |
          import json,os
          from pathlib import Path
          from tools.psp_mesh_audit import audit_yobj
          from tools.psp_mesh_merge_trial import sections
          def final(label):
              r=json.loads(Path(os.environ['RUNNER_TEMP'],'portable-'+label,'success.json').read_text())
              return audit_yobj(next(raw for s,raw in sections(Path(r['pac']).read_bytes()) if s['id']==2))
          a,b=final('Lance'),final('LanceMulti')
          assert a['texture_raw']==b['texture_raw']
          assert a['bone_raw']==b['bone_raw']
          assert len(a['meshes'])==len(b['meshes'])
          for x,y in zip(a['meshes'],b['meshes']):
              assert x['vertices']==y['vertices'] and x['bone_palette']==y['bone_palette']
              assert x['materials']==y['materials']
      - name: Package portable ZIP
        shell: python
        run: |
          import shutil,hashlib
          from pathlib import Path
          path=shutil.make_archive('dist/PS2PSP-Pac-Converter-Windows-x64','zip','dist','PS2PSP-Pac-Converter')
          p=Path(path)
          Path(path+'.sha256').write_text(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: PS2PSP-Pac-Converter-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish isolated preview build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "portable-preview-${{ github.run_number }}-${{ github.sha }}"
          @'
          Portable Windows x64 experimental preview. Retains independently converted HCTP elbow-pad YOBJs from sections 6/7 as PSP sections 26/27, gated by verified left/right controller support and rest hierarchies. Includes the shared accessory texture and combined textured previews; no pad decimation, donor weight transfer or merging into the body. Every final YOBJ receives native pointer/index/palette/weight/alignment checks and analytical pose replay. Unknown extra model roles and unsupported rig contracts are rejected instead of silently dropped. The uploaded Rock source was tested separately on Linux; actual SVR 2011 pad removal/throw behavior still needs PPSSPP testing. CI exercises single-model and generated independent accessory rigs in the frozen Windows app and checks unchanged main geometry. Retains the prior bounded precision fallback for oversized sources and the 148000-byte output budget. Uses bundled Blender 4.3.2, requires your own supported PSP base PAC, and bundles no game assets. Current supported PSP bases still require ordinary indexed4 and indexed8 rendering templates; the supplied native 2011 Rock was a structure reference, not the conversion donor. No experimental changes are merged into main.
          '@ | Set-Content "$env:RUNNER_TEMP/release-notes.txt" -Encoding utf8NoBOM
          gh release create $tag dist/*.zip dist/*.sha256 --target '${{ github.sha }}' --prerelease --title 'PS2PSP Pac Converter by RyosPrime — Windows preview' --notes-file "$env:RUNNER_TEMP/release-notes.txt"

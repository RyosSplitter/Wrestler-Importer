name: Build portable PS2PSP preview
on:
  workflow_dispatch:
  push:
    branches: [feature/portable-ps2psp, fix/hctp-primary-model, experiment/precision-budget-fit, experiment/multi-yobj-accessories, experiment/content-aware-textures, experiment/scalp-compatibility-update, experiment/texture-fidelity-selection, feature/default-texture-quality]
    paths: ['desktop/**', 'model_qa/**', 'tests/test_head_qa.py', 'tests/test_skin_palette_padding.py', 'tests/test_portable_skinning.py', 'ps2psp_converter.py', 'app/ps2_textures.py', 'tools/build_portable.py', 'tools/portable_fixture.py', 'tools/blender_reduce.py', 'tools/pac_inspect.py', 'tools/pac_repack.py', 'tools/hctp_read.py', 'tools/hctp_weights.py', 'tools/yobj_read.py', 'requirements-desktop.txt', 'docs/portable-*.md', 'tests/test_portable_*.py', 'tests/test_adaptive_textures.py', 'tests/test_texture_review.py', 'tests/test_priority_reallocation.py', 'tests/test_texture_modes.py', 'tests/test_maximum_downgrade.py', 'tests/test_main_model_selection.py', '.github/workflows/windows-portable.yml']
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine whether conversion code changed
        id: scope
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import ast,os,subprocess
          from pathlib import Path
          full=True
          if os.environ['EVENT_NAME']=='push':
              paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
              if paths==['desktop/gui.py']:
                  before=ast.parse(subprocess.check_output(['git','show','HEAD^:desktop/gui.py'],text=True))
                  after=ast.parse(Path('desktop/gui.py').read_text())
                  def handlers(tree):
                      return {n.name:ast.dump(n,include_attributes=False) for c in tree.body if isinstance(c,ast.ClassDef) for n in c.body if isinstance(n,ast.FunctionDef) and n.name not in ('__init__','button','label')}
                  full=handlers(before)!=handlers(after)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('full='+str(full).lower()+'\n')
          print('Full converter validation required:',full)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - name: Prepare development-only PSP donor and modified HCTP trials
        shell: python
        run: |
          from pathlib import Path
          import json,zipfile,sys
          sys.path.insert(0,str(Path.cwd()))
          from tools.portable_fixture import create, create_with_accessories
          from tools.generate_conformance_fixtures import pac, vectors
          from tools.pac_inspect import inspect_pac
          Path('assets').mkdir(exist_ok=True)
          Path('build/test-inputs').mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('downloads/Wrestler-Importer-beta-0.1.1.zip') as z:
              for name in ('Kurt-Angle-Ring.PAC','Full Body.yobj'):
                  Path('assets',name).write_bytes(z.read('WrestlerImporterBeta/assets/'+name))
          cases=[('Lance','1800-hybrid-weight-review.zip','1800-hybrid-weight-review/source-weighted.json'),('Jericho','Jericho-QA-facial-weights-experiment.zip','trial/input-source-weighted.json')]
          for label,archive,entry in cases:
              with zipfile.ZipFile('downloads/'+archive) as z: source=json.loads(z.read(entry))
              create(source,Path('build/test-inputs',label+'-modified-HCTP.pac'))
              if label=='Lance':create_with_accessories(source,Path('build/test-inputs/LanceMulti-modified-HCTP.pac'))
      - run: python -m tools.ci_tests
      - name: Build app, audited runtime, source bundle and notices
        run: python -m tools.build_portable
      - name: Packaged UI and bundled runtime with developer tools removed from PATH
        shell: pwsh
        run: |
          $env:PS2PSP_DATA = "$env:RUNNER_TEMP\ps2psp-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = "$env:RUNNER_TEMP\portable-smoke.json"
          $p = Start-Process dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe -ArgumentList @('--smoke-test',$output) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Frozen GUI/runtime smoke test failed' }
          Get-Content $output
          Copy-Item ([System.IO.Path]::ChangeExtension($output,'png')) dist/PS2PSP-converter-preview.png
          Copy-Item "$env:RUNNER_TEMP/texture-chooser.png" dist/PS2PSP-texture-chooser.png
      - name: Frozen single-slot layout control and exact preservation
        shell: python
        run: |
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tests.test_portable_skinning import one_slot_model
          from tools.generate_conformance_fixtures import vectors,pac
          from tools.psp_mesh_merge_trial import sections
          from tools.psp_mesh_audit import audit_yobj
          texture=next(raw for s,raw in sections(vectors()['psp-quad.pac']) if s['id']==9)
          source=Path('build/test-inputs/single-slot.pac')
          source.write_bytes(pac([(2,one_slot_model()),(9,texture),(50,b'opaque retained control')]))
          output=Path('build/frozen-skin-control')
          subprocess.run(['dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe','--skin-compatibility',str(source),str(output)],check=True,timeout=120)
          report=json.loads((output/'skin-compatibility.json').read_text())
          assert report['changed_meshes']==1 and report['added_vertex_buffer_bytes']==32
          a={s['id']:raw for s,raw in sections(source.read_bytes())}
          b={s['id']:raw for s,raw in sections((output/'candidate.pac').read_bytes())}
          assert a[9]==b[9] and a[50]==b[50]
          assert audit_yobj(b[2])['meshes'][0]['weight_slots']==3
          print('Frozen one-slot adaptation and exact effective geometry/weight replay passed.')
      - name: Frozen conversion, QA and textured previews including multi-YOBJ source
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 35
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in @('Lance','Jericho','LanceMulti')) {
            $job = "$env:RUNNER_TEMP\portable-$name"
            New-Item -ItemType Directory -Path $job | Out-Null
            @{source=(Resolve-Path "build/test-inputs/$name-modified-HCTP.pac").Path; base=(Resolve-Path 'assets/Kurt-Angle-Ring.PAC').Path; source_format='hctp'} | ConvertTo-Json | Set-Content "$job/request.json" -Encoding utf8NoBOM
            $p = Start-Process dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe -ArgumentList @('--worker',"$job/request.json") -PassThru -Wait
            if ($p.ExitCode -ne 0) { Get-Content "$job/error.log"; Get-Content "$job/work/geometry-0.log"; throw "Frozen $name conversion failed" }
            Get-Content "$job/success.json"
          }
          $single = Get-Content "$env:RUNNER_TEMP\portable-Lance\success.json" -Raw | ConvertFrom-Json
          $multi = Get-Content "$env:RUNNER_TEMP\portable-LanceMulti\success.json" -Raw | ConvertFrom-Json
          if ($multi.model_count -ne 3 -or $multi.accessory_sections.Count -ne 2) { throw 'Accessory source models were dropped' }
          if ($single.sha256 -eq $multi.sha256) { throw 'Multi-model output unexpectedly equals main-only output' }
          Write-Output 'Multi-model input retains two independently audited PSP accessories.'
      - name: Check new Default texture budget, automatic attention and exact model preservation
        if: steps.scope.outputs.full == 'true'
        shell: python
        run: |
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.psp_mesh_merge_trial import sections
          from desktop.default_textures import REFERENCE_PIXEL_BYTES
          from desktop.core import validate_pac
          from desktop.texture_optimizer.candidates import read_gim
          for name in ('Lance','Jericho','LanceMulti'):
              job=Path(os.environ['RUNNER_TEMP'],'portable-'+name)
              r=json.loads((job/'success.json').read_text())
              assert r['texture_mode']=='Default' and r['default_textures']['unchanged_model_payloads']
              report=json.loads((job/'work/default-textures/report.json').read_text())
              assert report['pixel_palette_budget']>=REFERENCE_PIXEL_BYTES
              assert report['default_policy']['priority_origin']=='automatic-content'
              assert len(report['default_policy']['chosen_priorities'])<=3
              validate_pac(Path(r['pac']).read_bytes(),gim_reader=read_gim)
              before={s['id']:raw for s,raw in sections(Path(r['default_textures']['baseline_pac']).read_bytes())}
              after={s['id']:raw for s,raw in sections(Path(r['pac']).read_bytes())}
              assert before.keys()==after.keys()
              for section,raw in before.items():
                  if section!=9:assert raw==after[section]
              assert r['bytes']<=148000
              print('Frozen new Default:',name,r['bytes'],report['pixel_palette_bytes'],report['default_policy']['chosen_priorities'])
      - name: Frozen Legacy comparison mode
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 12
        shell: python
        run: |
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from desktop.core import validate_pac
          root=Path(os.environ['RUNNER_TEMP'],'portable-legacy');root.mkdir()
          request=dict(source=str(Path('build/test-inputs/Lance-modified-HCTP.pac').resolve()),
              base=str(Path('assets/Kurt-Angle-Ring.PAC').resolve()),texture_mode='Legacy')
          (root/'request.json').write_text(json.dumps(request))
          subprocess.run(['dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe','--worker',str(root/'request.json')],check=True,timeout=600)
          r=json.loads((root/'success.json').read_text())
          assert r['texture_mode']=='Legacy' and 'default_textures' not in r
          validate_pac(Path(r['pac']).read_bytes())
          print('Frozen Legacy generation remains available:',r['bytes'])
      - name: Frozen adaptive texture A/B and immutable model verification
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $job = "$env:RUNNER_TEMP\portable-adaptive"
          New-Item -ItemType Directory -Path $job | Out-Null
          @{source=(Resolve-Path 'build/test-inputs/Lance-modified-HCTP.pac').Path; base=(Resolve-Path 'assets/Kurt-Angle-Ring.PAC').Path; source_format='hctp'; texture_mode='ATO'} | ConvertTo-Json | Set-Content "$job/request.json" -Encoding utf8NoBOM
          $p = Start-Process dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe -ArgumentList @('--worker',"$job/request.json") -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$job/error.log"; throw 'Frozen adaptive job failed' }
          Get-Content "$job/success.json"
        if: steps.scope.outputs.full == 'true'
      - name: Check frozen adaptive output and unchanged model payloads
        shell: python
        if: steps.scope.outputs.full == 'true'
        run: |
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.psp_mesh_merge_trial import sections
          from desktop.core import validate_pac
          from desktop.texture_optimizer.candidates import read_gim
          root=Path(os.environ['RUNNER_TEMP'],'portable-adaptive')
          r=json.loads((root/'success.json').read_text())
          current=Path(r['adaptive_textures']['baseline_pac']).read_bytes()
          result=Path(r['pac']).read_bytes()
          validate_pac(result,gim_reader=read_gim)
          a={s['id']:raw for s,raw in sections(current)}
          texture_stage=Path(r['skin_palette_compatibility']['baseline_pac']).read_bytes()
          b={s['id']:raw for s,raw in sections(texture_stage)}
          assert a.keys()==b.keys()
          for section,raw in a.items():
              if section!=9: assert raw==b[section]
          assert len(result)<=148000
      - name: Frozen source texture previews and priority conversions in both modes
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 15
        shell: python
        run: |
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,str(Path.cwd()))
          from tools.psp_mesh_merge_trial import sections
          from desktop.core import validate_pac
          from desktop.texture_optimizer.candidates import read_gim
          exe='dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe'
          root=Path(os.environ['RUNNER_TEMP'],'portable-priorities');root.mkdir()
          source=Path('build/test-inputs/Lance-modified-HCTP.pac').resolve()
          manifest=root/'inspection.json'
          subprocess.run([exe,'--inspect',str(source),str(manifest)],check=True,timeout=120)
          info=json.loads(manifest.read_text())
          assert info['ok'],info
          info=info['info'];previews=info['texture_previews']
          assert len(previews)==info['textures'] and len(previews)>=3
          for row in previews:
              assert Image.open(row['png']).size==(row['width'],row['height'])
          chosen=[p['name'] for p in previews[:3]]
          for adaptive in (False,True):
              job=root/('adaptive' if adaptive else 'default');job.mkdir()
              request=dict(source=str(source),base=str(Path('assets/Kurt-Angle-Ring.PAC').resolve()),source_format='hctp',
                  adaptive_textures=adaptive,texture_mode='' if adaptive else 'Priority Selection',priority_textures=chosen,texture_review_sha256=info['source_sha256'])
              (job/'request.json').write_text(json.dumps(request))
              subprocess.run([exe,'--worker',str(job/'request.json')],check=True,timeout=420)
              result=json.loads((job/'success.json').read_text())
              validate_pac(Path(result['pac']).read_bytes(),gim_reader=read_gim)
              priority=result['texture_priorities'];assert priority['names']==chosen
              before={s['id']:raw for s,raw in sections(Path(priority['baseline_pac']).read_bytes())}
              after={s['id']:raw for s,raw in sections(Path(result['pac']).read_bytes())}
              for section,raw in before.items():
                  if section!=9:assert raw==after[section]
              report=json.loads((job/'work/texture-priorities/report.json').read_text())
              assert report['priority_reallocation'] is True
              assert 'donor' in report['unselected_policy']
              assert report['pixel_palette_bytes']<=report['pixel_palette_budget']
              assert result['bytes']<=148000
              assert all(t['priority_quality_improvement']>=-1e-10 for t in report['textures'] if t['manual_priority'])
              print('Frozen priority mode:',adaptive,'bytes:',result['bytes'],'reductions:',priority['reductions'])
      - name: Frozen Downgrade mode and unchanged model verification
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 8
        shell: python
        run: |
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.psp_mesh_merge_trial import sections
          from desktop.core import validate_pac
          from desktop.texture_optimizer.candidates import read_gim
          exe='dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe'
          root=Path(os.environ['RUNNER_TEMP'],'portable-downgrade');root.mkdir()
          request=dict(source=str(Path('build/test-inputs/Lance-modified-HCTP.pac').resolve()),
              base=str(Path('assets/Kurt-Angle-Ring.PAC').resolve()),source_format='hctp',
              texture_mode='Downgrade',downgrade_steps=2)
          (root/'request.json').write_text(json.dumps(request))
          subprocess.run([exe,'--worker',str(root/'request.json')],check=True,timeout=420)
          result=json.loads((root/'success.json').read_text())
          assert result['texture_mode']=='Downgrade' and result['texture_downgrade']['steps']==2
          validate_pac(Path(result['pac']).read_bytes(),gim_reader=read_gim)
          report=json.loads((root/'work/texture-downgrade/report.json').read_text())
          assert report['export_eligible'] and not report['source_based']
          assert report['pixel_palette_bytes']<=report['pixel_palette_budget'] and result['bytes']<=148000
          before={s['id']:(s,raw) for s,raw in sections(Path(result['texture_downgrade']['baseline_pac']).read_bytes())}
          after={s['id']:(s,raw) for s,raw in sections(Path(result['pac']).read_bytes())}
          for section,(s,raw) in before.items():
              if section!=9:assert raw==after[section][1] and s['sha256']==after[section][0]['sha256']
          assert all(t['palette_bytes_identical'] for t in report['textures'])
          print('Frozen Downgrade bytes:',result['bytes'],'pixels:',report['pixel_palette_bytes'])
      - name: Frozen Maximum Downgrade rescue and unchanged model verification
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 8
        shell: python
        run: |
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tests.test_maximum_downgrade import MaximumDowngradeTests
          from tools.psp_mesh_merge_trial import sections
          from desktop.core import validate_pac
          from desktop.texture_optimizer.candidates import read_gim
          exe='dist/PS2PSP-Pac-Converter/PS2PSP-Pac-Converter.exe'
          root=Path(os.environ['RUNNER_TEMP'],'portable-maximum');root.mkdir()
          source=root/'oversized-control.pac';data=MaximumDowngradeTests().baseline();source.write_bytes(data)
          target=len(data)-2048
          subprocess.run([exe,'--maximum-downgrade',str(source),str(root/'rescue'),str(target)],check=True,timeout=180)
          result=(root/'rescue/candidate.pac').read_bytes();validate_pac(result,max_bytes=target,gim_reader=read_gim)
          a={s['id']:(s['sha256'],r) for s,r in sections(data)}
          b={s['id']:(s['sha256'],r) for s,r in sections(result)}
          assert all(a[i]==b[i] for i in a if i!=9)
          request=dict(source=str(Path('build/test-inputs/Lance-modified-HCTP.pac').resolve()),
              base=str(Path('assets/Kurt-Angle-Ring.PAC').resolve()),texture_mode='Maximum Downgrade')
          (root/'request.json').write_text(json.dumps(request))
          subprocess.run([exe,'--worker',str(root/'request.json')],check=True,timeout=420)
          r=json.loads((root/'success.json').read_text())
          assert r['texture_mode']=='Maximum Downgrade' and r['bytes']<=148000
          assert r['maximum_downgrade']['unchanged_non_texture_payloads']
          print('Frozen Maximum rescue:',len(data),'->',len(result),'worker:',r['bytes'])
      - name: Main geometry remains identical with independent accessory models
        if: steps.scope.outputs.full == 'true'
        shell: python
        run: |
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.psp_mesh_audit import audit_yobj
          from tools.psp_mesh_merge_trial import sections
          def final(label):
              r=json.loads(Path(os.environ['RUNNER_TEMP'],'portable-'+label,'success.json').read_text())
              return audit_yobj(next(raw for s,raw in sections(Path(r['pac']).read_bytes()) if s['id']==2))
          a,b=final('Lance'),final('LanceMulti')
          assert b['texture_names']==a['texture_names']+['fixture_pad']
          assert a['bone_raw']==b['bone_raw']
          assert len(a['meshes'])==len(b['meshes'])
          for x,y in zip(a['meshes'],b['meshes']):
              assert x['vertices']==y['vertices'] and x['bone_palette']==y['bone_palette']
              assert x['materials']==y['materials']
      - name: Package portable ZIP
        shell: python
        run: |
          import shutil,hashlib
          from pathlib import Path
          path=shutil.make_archive('dist/PS2PSP-Pac-Converter-Windows-x64','zip','dist','PS2PSP-Pac-Converter')
          p=Path(path)
          Path(path+'.sha256').write_text(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: PS2PSP-Pac-Converter-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.png
      - name: Publish isolated preview build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "portable-preview-${{ github.run_number }}-${{ github.sha }}"
          @'
          PS2PSP v0.25.6 Windows x64. Default now automatically favors lost fine texture detail using a separately measured native-reference pixel/CLUT allowance and actual 148000-byte PAC fitting. No wrestler-specific names or hashes select detail priorities. Legacy preserves the previous Default texture path; ATO remains the earlier adaptive comparison. Manual Priority Selection uses the new reference allowance, and Downgrade reduces new Default textures. Maximum Downgrade remains available. Texture stages preserve geometry, rigging, UVs and material depth. Includes source skinning identity validation, full QA, classic interface, bundled Blender, source and notices; no game assets. The fixed RVD singlet candidate was reported successful in SVR 2011 by the user; this generalized policy still requires model-specific PPSSPP testing. Requires your own supported PSP base and Windows 10/11 x64. Accepted PACs and main remain preserved.
          '@ | Set-Content "$env:RUNNER_TEMP/release-notes.txt" -Encoding utf8NoBOM
          gh release create $tag dist/*.zip dist/*.sha256 dist/*.png --target '${{ github.sha }}' --prerelease --title 'PS2PSP v0.25.6 — Default texture quality' --notes-file "$env:RUNNER_TEMP/release-notes.txt"
